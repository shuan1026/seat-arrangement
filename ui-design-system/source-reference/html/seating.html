<!-- page: 座位安排 -->
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>座位安排｜Seat Arrangement</title>
<link rel="stylesheet" href="../../token-gallery/data/tokens.css">
<link rel="stylesheet" href="prototype/prototype.css">
</head>
<body data-page="seating" data-nav="seating">
<section class="page-content page-content--full">
  <div class="page-static">
    <header class="page-head">
      <div class="page-title">
        <h1>座位安排</h1>
        <div id="page-summary"></div>
      </div>
      <div class="page-actions" id="page-actions"></div>
    </header>
  </div>
  <div id="view"></div>
</section>
<script src="prototype/roster.js"></script><script src="prototype/registrations-2026.js"></script><script src="prototype/data.js"></script><script src="prototype/core.js"></script><script src="prototype/ui.js"></script><script src="prototype/shell.js"></script>
<script>
const { $, $$, esc, C } = GH;
const { node, icon } = UI;
const CAP = C.CAPACITY;
const isMobile = () => innerWidth < 768;
// ---- 畫面狀態
let peopleTab = GH.qs('view') === 'all' ? 'all' : 'unseated';
let q = '';
let filters = { dept: '', cat: '' };
let selected = GH.qs('table') ? +GH.qs('table') : null;
let mobileTab = 'map';
let hit = null, hitTimer = null;
let drag = null;
let mobileDialog = null;
let scrollPos = { left: null, top: null, list: 0 };
const view = () => GH.state.view;
const expanded = () => !!view().expanded;
// 人員面板：沒有手動開關過時，視窗低於 1024 px 預設收合，和 Sidebar 一樣（第 7.2.2 節）；手機用分頁切換，不受影響
const panelOpen = () => isMobile() || (view().panel ?? innerWidth >= 1024);

// ---- 座位圖的幾何（第 6.6 節）：收合是 88 px 圓形，展開是 280 px 卡片；欄距與列距依模式不同
const PAD = 24, BAND = 56, GAP = 32;
// 展開卡片固定 220 px 高（標頭兩行各截成一行），列距 240 px 才不會和同一欄的下一張重疊
const UNIT = () => (expanded() ? { w: 296, h: 240, item: 280, itemH: 220 } : { w: 112, h: 104, item: 88, itemH: 88 });
const geometry = () => { const u = UNIT(); return { u, W: PAD * 2 + 5 * u.w + u.item, y0: PAD + BAND + GAP, H: PAD + BAND + GAP + 5 * u.h + u.itemH + GAP + BAND + PAD }; };
const clampZoom = z => Math.min(2, Math.max(0.25, z));
// 縮放（第 7.2.1 節）：沒有手動縮放就是「適合視窗」，開啟、改變視窗大小、開關桌次詳情時都重新計算；
// 手動縮放才記住比例，桌面與手機分開記，桌面的比例不會帶到手機
const zoomKey = () => (isMobile() ? 'zoomMobile' : 'zoomDesktop');
const savedZoom = () => view()[zoomKey()] ?? null;
let fitZ = null;
const zoomOf = () => savedZoom() ?? fitZ ?? 1;
// 縮放低於 80% 時，圓桌只顯示桌號與人數（第 6.6 節）
const COMPACT_BELOW = 0.8;
const isCompact = z => !expanded() && z < COMPACT_BELOW;

// ---- 人員面板（第 7.2.2 節）
const passFilters = p => (!filters.dept || GH.deptOf(p) === filters.dept) && (!filters.cat || p.cat === filters.cat);
// 工作人員坐工作人員桌，不算未入座，只出現在「全部」（第 7.2.2 節）
const inTab = p => peopleTab === 'all' || (!GH.isStaff(p) && !GH.tableOf(p.id));
const visiblePeople = () => GH.sortedPeople().filter(p => inTab(p) && passFilters(p) && GH.matches(p, q));
const hasFilters = () => filters.dept || filters.cat;

function personRow(p) {
  const draggable = !isMobile();
  return `<div class="person-row" draggable="${draggable}" ${draggable ? `data-drag-person="${p.id}"` : ''} data-person="${p.id}">
    <div class="person-main">${UI.nameLine(p)}<div class="person-sub">${UI.metaLine(p)}${peopleTab === 'all' ? UI.seatBadge(p) : ''}</div></div>
    ${UI.rowMenu('personMenu', p.id)}</div>`;
}
function peopleEmpty() {
  if (!GH.people().length) return UI.empty({ inline: true, icon: 'users', title: '還沒有參與人員。', body: '到員工名單把報名的員工加入尾牙，或新增貴賓與眷屬後，就可以開始安排座位。', btn: UI.btn('前往員工名單', { v: 'primary', icon: 'id-card', href: 'employees.html' }) });
  // 「未入座」搜不到、但「全部」有符合的人：多半是已入座的人，直接告訴他在哪一桌（第 7.2.2 節）
  if (q && peopleTab === 'unseated') {
    const found = GH.sortedPeople().filter(p => passFilters(p) && GH.matches(p, q));
    if (found.length) {
      const p = found[0], t = GH.tableOf(p.id), name = GH.displayName(p);
      const title = found.length > 1 ? `未入座裡找不到「${q}」。` : GH.isStaff(p) ? `${name} 在工作人員桌。` : `${name} 已入座，在第 ${t.no} 桌。`;
      return UI.empty({ inline: true, title, body: found.length > 1 ? `全部有 ${found.length} 位符合。` : '', btn: UI.btn('在全部中查看', { act: 'showAll' }) });
    }
  }
  if (q) return UI.empty({ inline: true, title: `找不到「${q}」。`, btn: UI.btn('清除搜尋', { act: 'clearSearch' }) });
  if (hasFilters()) return UI.empty({ inline: true, title: '找不到符合條件的人員。', btn: UI.btn('清除篩選', { act: 'clearFilters' }) });
  return UI.empty({ inline: true, title: '所有人都已入座。', body: '新增人員後會出現在這裡。' });
}
function peoplePanel() {
  const all = GH.people(), unseated = GH.unseated();
  const root = node(`<aside class="people-panel ${panelOpen() ? '' : 'is-hidden'}" aria-label="人員">
    <div class="people-head"><h2>人員</h2>${UI.iconBtn('panel-left-close', '隱藏人員面板', { act: 'panelToggle', sm: true })}</div>
    <div class="people-tools"><div class="input-icon">${icon('search')}<input class="input input--sm" data-q placeholder="搜尋姓名、分機、部門或單位" aria-label="搜尋姓名、分機、部門或單位" value="${esc(q)}"></div><div data-tabs></div><div class="people-filters" data-filters></div></div>
    <div class="drop-hint">放開以移出桌次</div>
    <div class="people-list" data-list></div></aside>`);
  const input = $('[data-q]', root);
  input.addEventListener('input', () => { q = input.value; paintList(); });
  $('[data-tabs]', root).replaceWith(UI.tabsPill([{ value: 'unseated', label: '未入座', count: unseated.length }, { value: 'all', label: '全部', count: all.length }], peopleTab, v => { peopleTab = v; GH.refresh(); }));
  const fl = $('[data-filters]', root);
  fl.append(UI.select({ sm: true, value: filters.dept, placeholder: '部門', prefix: filters.dept ? '部門' : '', ariaLabel: '部門', searchable: true, searchPlaceholder: '搜尋部門', options: [{ value: '', label: '不限' }, ...GH.depts().map(d => ({ value: d, label: d }))], onChange: v => { filters.dept = v; GH.refresh(); } }));
  fl.append(UI.select({ sm: true, value: filters.cat, placeholder: '類別', prefix: filters.cat ? '類別' : '', ariaLabel: '類別', options: [{ value: '', label: '不限' }, ...C.CATEGORIES.map(c => ({ value: c, label: c }))], onChange: v => { filters.cat = v; GH.refresh(); } }));
  const list = $('[data-list]', root);
  const paintList = () => { const rows = visiblePeople(); list.innerHTML = rows.length ? rows.map(personRow).join('') : peopleEmpty(); };
  paintList();
  // 從桌次或工作人員桌拖回面板，即移出桌次或移出工作人員桌
  const fromSeat = () => drag && (drag.fromNo || drag.fromStaff);
  list.addEventListener('dragover', e => { if (fromSeat()) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; list.classList.add('is-over'); } });
  list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) list.classList.remove('is-over'); });
  list.addEventListener('drop', e => { if (!fromSeat()) return; e.preventDefault(); list.classList.remove('is-over'); const p = GH.person(drag.pid); if (!p) return; if (drag.fromStaff) UI.unstaffPerson(p); else UI.unseatPerson(p); });
  return root;
}

// ---- 座位圖（第 7.2.1 節）
// 場地上固定的東西：地標，以及右上角（B 區外側列最上面、控台下方）的工作人員桌，它不是 30 桌之一
function landmarksHTML(g) {
  const { u, y0 } = g;
  return C.LANDMARKS.map(l => {
    const left = PAD + l.cols[0] * u.w, width = (l.cols[1] - l.cols[0]) * u.w + u.item;
    const top = l.bottom ? y0 + 5 * u.h + u.itemH + GAP : PAD;
    return `<div class="landmark" style="left:${left}px;top:${top}px;width:${width}px;height:${BAND}px" aria-hidden="true">${l.label}</div>`;
  }).join('') + staffTableHTML(g);
}
// 工作人員桌（第 7.2.5 節）：放工作人員，最多 10 位；可以拖進拖出，點開看名單
const STAFF_SPOT = { col: 5, row: 0 };
function staffTableHTML(g) {
  const staff = GH.staff(), u = g.u, full = staff.length >= CAP, label = GH.labelsOf(staff).join('＋') || '空桌';
  const x = PAD + STAFF_SPOT.col * u.w, y = g.y0 + STAFF_SPOT.row * u.h;
  const cls = `seat-table seat-table--staff ${staff.length ? '' : 'is-empty'} ${full ? 'is-full' : ''} ${selected === 'staff' ? 'is-selected' : ''}`;
  const count = full ? UI.status('已滿') : `<span class="seat-count">${staff.length}/${CAP}</span>`;
  if (!expanded()) {
    return `<div class="${cls}" data-staff="1" style="left:${x}px;top:${y}px">
      <button type="button" class="seat-circle" data-act="openStaff" aria-label="工作人員桌，${esc(label)}，${staff.length}/${CAP}" data-tip="工作人員桌・${esc(label)}"><span class="seat-staff">工作人員</span>${count}</button></div>`;
  }
  return `<div class="${cls}" data-staff="1" style="left:${x}px;top:${y}px">
    <div class="seat-card" data-act="openStaff" role="button" tabindex="0" aria-label="工作人員桌，${esc(label)}，${staff.length}/${CAP}">
      <div class="seat-card-head"><div><span class="seat-no">工作人員桌</span></div>${count}</div>
      <div class="seat-depts">${esc(label)}</div>
      <ol class="seat-list">${seatRows(null, staff, 'seat-row')}</ol></div></div>`;
}
function seatRows(t, seats, cls) {
  return Array.from({ length: CAP }, (_, i) => {
    const p = seats[i];
    if (!p) return `<li class="${cls} is-empty" data-index="${i}"><span class="seat-idx">${i + 1}</span>空位</li>`;
    const draggable = !isMobile();
    return `<li class="${cls}" draggable="${draggable}" ${draggable ? `data-drag-person="${p.id}"` : ''} data-index="${i}" data-person="${p.id}"><span class="seat-idx">${i + 1}</span><span class="truncate">${esc(GH.displayName(p))}</span>${UI.seatMarks(p)}</li>`;
  }).join('');
}
function tableHTML(t, g) {
  const seats = GH.seats(t), full = GH.isFull(t), label = GH.tableLabel(t), u = g.u;
  const x = PAD + t.col * u.w, y = g.y0 + t.row * u.h;
  const cls = `seat-table ${seats.length ? '' : 'is-empty'} ${full ? 'is-full' : ''} ${hit === t.no ? 'is-hit' : ''} ${selected === t.no ? 'is-selected' : ''}`;
  const count = full ? UI.status('已滿') : `<span class="seat-count">${seats.length}/${CAP}</span>`;
  // 拖移把手：只能從這裡拖整桌去對調（第 7.2.1 節）；手機不拖移
  const handle = isMobile() ? '' : UI.iconBtn('grip-vertical', '拖移調換桌次', { xs: true, cls: 'seat-handle', act: 'noop', attrs: { draggable: 'true', 'data-drag-table': t.no } });
  if (!expanded()) {
    return `<div class="${cls}" data-no="${t.no}" style="left:${x}px;top:${y}px">
      <button type="button" class="seat-circle" data-act="openTable" data-no="${t.no}" aria-label="第 ${t.no} 桌，${esc(t.note ? `${t.note}，` : '')}${esc(label)}，${seats.length}/${CAP}" data-tip="${esc(t.note ? `${t.note}・${label}` : label)}"><span class="seat-no">${t.no}</span><span class="seat-label truncate">${esc(t.note || label)}</span>${count}</button>
      ${handle}</div>`;
  }
  return `<div class="${cls}" data-no="${t.no}" style="left:${x}px;top:${y}px">
    <div class="seat-card" data-act="openTable" data-no="${t.no}" role="button" tabindex="0" aria-label="第 ${t.no} 桌，${esc(label)}，${seats.length}/${CAP}">
      <div class="seat-card-head"><div><span class="seat-no">第 ${t.no} 桌</span></div>${count}${handle}</div>
      ${t.note ? `<div class="seat-note">${esc(t.note)}</div>` : ''}<div class="seat-depts">${esc(label)}</div>
      <ol class="seat-list">${seatRows(t, seats, 'seat-row')}</ol></div></div>`;
}
function mapHTML() {
  const g = geometry();
  const z = zoomOf();
  return `<div class="map">
    <div class="map-toolbar">
      ${panelOpen() ? '' : UI.btn('顯示人員面板', { icon: 'panel-left-open', act: 'panelToggle' })}
      <span class="map-zoom">${UI.iconBtn('zoom-out', '縮小', { outline: true, act: 'zoomOut' })}<span class="pct" data-pct>${Math.round(z * 100)}%</span>${UI.iconBtn('zoom-in', '放大', { outline: true, act: 'zoomIn' })}${UI.iconBtn('maximize', '適合視窗', { outline: true, act: 'zoomFit' })}</span>
      ${UI.btn(expanded() ? '全部收合' : '全部展開', { icon: expanded() ? 'fold-vertical' : 'unfold-vertical', act: 'toggleAll' })}
      <span class="toolbar-right">${UI.btn('自動排座', { icon: 'wand-sparkles', act: 'autoSeat' })}</span>
    </div>
    <div class="map-body">
      <div class="map-viewport" tabindex="-1" aria-label="座位圖"><div class="map-stage" style="width:${g.W * z}px;height:${g.H * z}px"><div class="map-content ${isCompact(z) ? 'is-compact' : ''}" style="width:${g.W}px;height:${g.H}px;transform:scale(${z})">${landmarksHTML(g)}${GH.tables().map(t => tableHTML(t, g)).join('')}</div></div></div>
    </div></div>`;
}
function summaryHTML() {
  const s = GH.stats();
  return `<div class="seat-summary"><span>已入座 <b>${s.seated}</b>／<b>${s.total}</b></span><span class="sep"></span><span>未入座 <b>${s.unseated}</b></span><span class="sep"></span><span>空位 <b>${s.empty}</b></span><span class="sep"></span><span>已滿 <b>${s.full}</b> 桌</span></div>`;
}

// ---- 桌次詳情（第 7.2.3 節）：桌面是浮出面板，手機是 Dialog
function tableBody(t) {
  const seats = GH.seats(t), labels = GH.tableLabels(t);
  const body = node(`<div class="stack">
    <div class="field"><label for="tp-note">備註名稱</label><input id="tp-note" class="input" data-note placeholder="例如主桌、董事貴賓、供應商" value="${esc(t.note)}" maxlength="20"><div class="badges">${C.NOTE_SUGGESTIONS.map(s => `<button type="button" class="badge badge--outline" data-suggest="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
    <div class="tp-meta"><span>部門：<b>${esc(labels.join('＋') || '—')}</b></span><span>兒童椅 <b>${GH.childSeats(t)}</b> 張</span><span>素食 <b>${GH.vegCount(t)}</b> 位</span></div>
    <div><div class="row-between" style="margin-bottom:var(--space-1)"><h3 style="font:var(--text-sm-medium);font-family:var(--font-sans)">名單</h3></div><p class="muted text-xs" style="margin-bottom:var(--space-2)">拖移可以調整順序，也可以從人員面板直接拖進來。</p>
    <ol class="tp-list" data-tp-list data-no="${t.no}">${Array.from({ length: CAP }, (_, i) => {
      const p = seats[i];
      if (!p) return `<li class="tp-seat is-empty" data-index="${i}"><span class="seat-idx">${i + 1}</span>空位</li>`;
      const draggable = !isMobile();
      return `<li class="tp-seat" draggable="${draggable}" ${draggable ? `data-drag-person="${p.id}"` : ''} data-index="${i}" data-person="${p.id}">${draggable ? `<span class="grip">${icon('grip-vertical')}</span>` : ''}<span class="seat-idx">${i + 1}</span><div class="person-main">${UI.nameLine(p)}<div class="person-meta">${esc(GH.secondary(p) || '—')}</div></div>${UI.rowMenu('tableSeatMenu', p.id)}</li>`;
    }).join('')}</ol></div></div>`);
  const input = $('[data-note]', body);
  const saveNote = () => { const v = input.value.trim(); if (v === t.note) return; GH.setNote(t, v); GH.save(); UI.toast('已儲存'); GH.refresh(); };
  input.addEventListener('change', saveNote);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  body.addEventListener('click', e => { const b = e.target.closest('[data-suggest]'); if (b) { input.value = b.dataset.suggest; saveNote(); } });
  // 名單可拖移調整順序，也接受人員面板拖進來
  const list = $('[data-tp-list]', body);
  list.addEventListener('dragover', e => {
    if (!drag || drag.tableNo) return;
    if (GH.isFull(t) && drag.fromNo !== t.no) { e.dataTransfer.dropEffect = 'none'; return; }
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    list.classList.add('is-over');
    $$('.tp-seat.is-over', list).forEach(n => n.classList.remove('is-over'));
    const row = e.target.closest('[data-index]'); if (row) row.classList.add('is-over');
  });
  list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) { list.classList.remove('is-over'); $$('.tp-seat.is-over', list).forEach(n => n.classList.remove('is-over')); } });
  list.addEventListener('drop', e => { if (!drag || drag.tableNo) return; e.preventDefault(); const row = e.target.closest('[data-index]'); dropPerson(t.no, row ? +row.dataset.index : null); });
  return body;
}
const tableActions = t => [
  { label: '加入人員', v: 'primary', icon: 'user-plus', act: 'addPeople' },
  { label: '調換桌次…', v: 'outline', icon: 'arrow-right-left', act: 'swapTable' },
  // 觸發鈕用 destructive-outline，不搶主要動作；確認對話框裡的「清空桌次」才用 destructive-primary（第 6.5 節）
  { label: '清空桌次', v: 'danger-outline', icon: 'eraser', act: 'clearTable', disabled: !GH.seats(t).length },
];
// 對調兩桌（第 7.2.1 節）：名單與備註名稱整組交換，桌號與位置不變
function swapTables(a, b) {
  const ta = GH.table(a), tb = GH.table(b);
  if (!ta || !tb || a === b) return;
  const r = GH.swapTables(ta, tb);
  GH.save();
  UI.undoToast(`已把第 ${a} 桌和第 ${b} 桌對調。`, r.undo);
  GH.refresh();
}
// 自動排座（第 8.6 節）：先選範圍，直接套用，可一次復原
function autoSeatDialog() {
  const n = GH.autoSeatCandidates().length, k = GH.tables().filter(t => t.note).length;
  let mode = n ? 'fill' : 'reset';
  const body = node(`<div class="stack-sm" role="radiogroup" aria-label="自動排座範圍">
    <label class="checkbox radio ${n ? '' : 'is-disabled'}"><input type="radio" name="auto-mode" value="fill" ${mode === 'fill' ? 'checked' : ''} ${n ? '' : 'disabled'}><span class="box"></span><span>只排未入座的 ${n} 位${n ? '' : '<span class="muted">（沒有未入座的員工與眷屬）</span>'}</span></label>
    <label class="checkbox radio"><input type="radio" name="auto-mode" value="reset" ${mode === 'reset' ? 'checked' : ''}><span class="box"></span><span>清空後重排（有備註名稱的 ${k} 桌不動）</span></label></div>`);
  body.addEventListener('change', e => { mode = e.target.value; });
  UI.dialog({
    title: '自動排座', desc: '依員工名單的部門與組別順序排進沒有備註名稱的桌，同組的人盡量排在一起，眷屬跟著員工，外部貴賓與工作人員不排。', body, focus: false,
    actions: [{ label: '取消' }, {
      label: '開始排座', v: 'primary',
      onClick: () => {
        const r = GH.autoSeat(mode);
        if (!r.placed) { r.undo(); UI.toast('沒有可以排的員工與眷屬。', { type: 'warning' }); return; }
        GH.save();
        const range = r.first === r.last ? `${r.first}` : `${r.first}–${r.last}`;
        UI.undoToast(r.left ? `已把 ${r.placed} 位安排到第 ${range} 桌，還有 ${r.left} 位排不下，留在未入座。` : `已把 ${r.placed} 位安排到第 ${range} 桌。`, r.undo);
        GH.refresh();
      },
    }],
  });
}
// 拖移把手的替代操作（第 7.2.3 節）
function swapDialog(t) {
  const desc = x => x.note || GH.tableLabels(x).join('＋');
  const opts = GH.tables().filter(x => x.no !== t.no).map(x => ({ value: String(x.no), label: `第 ${x.no} 桌（${GH.seats(x).length}/${CAP}）${desc(x) ? `・${desc(x)}` : ''}` }));
  const f = UI.form([{ name: 'no', label: '桌次', type: 'select', required: true, requiredMsg: '請選擇桌次。', placeholder: '選擇桌次', searchable: true, searchPlaceholder: '搜尋桌號、部門或備註名稱', options: opts }]);
  UI.dialog({ title: `把第 ${t.no} 桌和哪一桌對調？`, body: f.el, actions: [{ label: '取消' }, { label: '確認對調', v: 'primary', onClick: () => { if (!f.validate()) return false; swapTables(t.no, +f.get('no')); } }] });
}
function tablePanel(t) {
  const seats = GH.seats(t);
  const panel = node(`<section class="table-panel" aria-label="第 ${t.no} 桌">
    <div class="tp-head"><div><h2>第 ${t.no} 桌</h2><p class="muted text-xs">${seats.length}/${CAP} 人</p></div>${UI.iconBtn('x', '關閉', { act: 'closeTable', sm: true })}</div>
    <div class="tp-body"></div>
    <div class="tp-foot">${tableActions(t).map(a => UI.btn(a.label, { v: a.v, icon: a.icon, act: a.act, disabled: a.disabled })).join('')}</div></section>`);
  $('.tp-body', panel).append(tableBody(t));
  return panel;
}
function openMobileTable(t) {
  if (mobileDialog) { const old = mobileDialog; mobileDialog = null; old.close(); }
  selected = t.no;
  const dlg = UI.dialog({
    title: `第 ${t.no} 桌`, desc: `${GH.seats(t).length}/${CAP} 人`, body: tableBody(t), focus: false,
    actions: [{ label: '關閉' }, ...tableActions(t).map(a => ({ label: a.label, v: a.v, icon: a.icon, disabled: a.disabled, keepOpen: true, onClick: () => { actions[a.act] && actions[a.act](); return false; } }))],
    onClose: () => { if (mobileDialog !== dlg) return; mobileDialog = null; selected = null; GH.refresh(); },
  });
  mobileDialog = dlg;
}
// ---- 工作人員桌詳情（第 7.2.5 節）：和桌次詳情同樣的位置；名單照參與人員的預設排序，不能調整順序
function staffBody() {
  const staff = GH.staff();
  const body = node(`<div class="stack">
    <p class="muted text-xs">活動當天值勤的員工，不算入座統計；匯出時列在座位表右上角。</p>
    <div class="tp-meta"><span>部門：<b>${esc(GH.labelsOf(staff).join('＋') || '—')}</b></span></div>
    <div><div class="row-between" style="margin-bottom:var(--space-1)"><h3 style="font:var(--text-sm-medium);font-family:var(--font-sans)">名單</h3></div><p class="muted text-xs" style="margin-bottom:var(--space-2)">從人員面板或其他桌次拖進來，或按「加入人員」。只有員工可以放進來。</p>
    <ol class="tp-list" data-staff-list>${Array.from({ length: CAP }, (_, i) => {
      const p = staff[i];
      if (!p) return `<li class="tp-seat is-empty"><span class="seat-idx">${i + 1}</span>空位</li>`;
      const draggable = !isMobile();
      return `<li class="tp-seat" draggable="${draggable}" ${draggable ? `data-drag-person="${p.id}"` : ''} data-person="${p.id}">${draggable ? `<span class="grip">${icon('grip-vertical')}</span>` : ''}<span class="seat-idx">${i + 1}</span><div class="person-main">${UI.nameLine(p)}<div class="person-meta">${esc(GH.secondary(p) || '—')}</div></div>${UI.rowMenu('staffSeatMenu', p.id)}</li>`;
    }).join('')}</ol></div></div>`);
  const list = $('[data-staff-list]', body);
  list.addEventListener('dragover', e => { if (!drag || drag.tableNo || drag.fromStaff) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; list.classList.add('is-over'); });
  list.addEventListener('dragleave', e => { if (!list.contains(e.relatedTarget)) list.classList.remove('is-over'); });
  list.addEventListener('drop', e => { if (!drag || drag.tableNo || drag.fromStaff) return; e.preventDefault(); list.classList.remove('is-over'); UI.toStaff(GH.person(drag.pid)); });
  return body;
}
function staffPanel() {
  const n = GH.staff().length;
  const panel = node(`<section class="table-panel" aria-label="工作人員桌">
    <div class="tp-head"><div><h2>工作人員桌</h2><p class="muted text-xs">${n}/${CAP} 人</p></div>${UI.iconBtn('x', '關閉', { act: 'closeTable', sm: true })}</div>
    <div class="tp-body"></div>
    <div class="tp-foot">${UI.btn('加入人員', { v: 'primary', icon: 'user-plus', act: 'addStaff', disabled: n >= CAP })}</div></section>`);
  $('.tp-body', panel).append(staffBody());
  return panel;
}
function openMobileStaff() {
  if (mobileDialog) { const old = mobileDialog; mobileDialog = null; old.close(); }
  selected = 'staff';
  const n = GH.staff().length;
  const dlg = UI.dialog({
    title: '工作人員桌', desc: `${n}/${CAP} 人`, body: staffBody(), focus: false,
    actions: [{ label: '關閉' }, { label: '加入人員', v: 'primary', icon: 'user-plus', disabled: n >= CAP, keepOpen: true, onClick: () => { actions.addStaff(); return false; } }],
    onClose: () => { if (mobileDialog !== dlg) return; mobileDialog = null; selected = null; GH.refresh(); },
  });
  mobileDialog = dlg;
}
const actions = {};

// ---- 拖放（第 7.2.1 節）
function dropPerson(no, index) {
  if (!drag) return;
  const p = GH.person(drag.pid); if (!p) return;
  const name = GH.displayName(p);
  // 從工作人員桌拖到桌次：先移出工作人員桌再入座，一次復原
  if (GH.isStaff(p)) {
    const r0 = GH.setStaff(p, false), r = GH.place(p.id, no, index);
    if (!r) { r0.undo(); UI.toast(`第 ${no} 桌已滿，請先移出一位。`, { type: 'warning' }); return; }
    GH.save();
    UI.undoToast(`已把 ${name} 從工作人員桌移到第 ${no} 桌。`, () => { r.undo(); r0.undo(); });
    GH.refresh();
    return;
  }
  const from = GH.tableOf(p.id);
  if (from && from.no === no && index == null) return;
  const r = GH.place(p.id, no, index);
  if (!r) { UI.toast(`第 ${no} 桌已滿，請先移出一位。`, { type: 'warning' }); return; }
  GH.save();
  UI.undoToast(!from ? `已把 ${name} 安排到第 ${no} 桌。` : from.no === no ? `已調整第 ${no} 桌的座位順序。` : `已把 ${name} 從第 ${from.no} 桌移到第 ${no} 桌。`, r.undo);
  GH.refresh();
}
function bindDrag(root) {
  root.addEventListener('dragstart', e => {
    const th = e.target.closest('[data-drag-table]');
    if (th) {
      drag = { tableNo: +th.dataset.dragTable };
      e.dataTransfer.setData('text/plain', `table:${drag.tableNo}`); e.dataTransfer.effectAllowed = 'move';
      th.closest('.seat-table').classList.add('is-dragging-table');
      return;
    }
    const el = e.target.closest('[data-drag-person]'); if (!el) return;
    const pid = el.dataset.dragPerson, from = GH.tableOf(pid), p = GH.person(pid), fromStaff = !!p && GH.isStaff(p);
    drag = { pid, fromNo: from ? from.no : null, fromStaff };
    e.dataTransfer.setData('text/plain', pid); e.dataTransfer.effectAllowed = 'move';
    el.classList.add('is-dragging');
    const panel = $('.people-panel', root); if (panel && (from || fromStaff)) panel.classList.add('is-target');
  });
  root.addEventListener('dragover', e => {
    if (!drag) return;
    const tbl = e.target.closest('.seat-table'); if (!tbl) return;
    // 工作人員桌只收人員，不參與整桌對調；本來就在工作人員桌的人放回去不動
    if (tbl.dataset.staff) {
      if (drag.tableNo || drag.fromStaff) return;
      $$('.seat-table.is-over', root).forEach(n => n !== tbl && n.classList.remove('is-over'));
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      tbl.classList.add('is-over');
      return;
    }
    const no = +tbl.dataset.no, t = GH.table(no);
    if (drag.tableNo) {
      if (no === drag.tableNo) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      $$('.seat-table.is-swap', root).forEach(n => n !== tbl && n.classList.remove('is-swap'));
      tbl.classList.add('is-swap');
      return;
    }
    $$('.seat-table.is-over', root).forEach(n => n !== tbl && n.classList.remove('is-over'));
    $$('.seat-row.is-over', root).forEach(n => n.classList.remove('is-over'));
    if (GH.isFull(t) && drag.fromNo !== no) { tbl.classList.add('is-over'); e.dataTransfer.dropEffect = 'none'; return; }
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    tbl.classList.add('is-over');
    const row = e.target.closest('.seat-row'); if (row) row.classList.add('is-over');
  });
  root.addEventListener('dragleave', e => { const tbl = e.target.closest('.seat-table'); if (tbl && !tbl.contains(e.relatedTarget)) tbl.classList.remove('is-over', 'is-swap'); });
  root.addEventListener('drop', e => {
    const tbl = e.target.closest('.seat-table'); if (!tbl || !drag) return;
    e.preventDefault(); tbl.classList.remove('is-over', 'is-swap');
    if (tbl.dataset.staff) { if (!drag.tableNo && !drag.fromStaff) UI.toStaff(GH.person(drag.pid)); return; }
    if (drag.tableNo) { if (+tbl.dataset.no !== drag.tableNo) swapTables(drag.tableNo, +tbl.dataset.no); return; }
    const row = e.target.closest('.seat-row');
    dropPerson(+tbl.dataset.no, row ? +row.dataset.index : null);
  });
}
// 拖移結束時清掉狀態；來源列可能已經因為重畫而不在畫面上，所以掛在 document
document.addEventListener('dragend', () => {
  drag = null;
  $$('.is-dragging, .is-dragging-table').forEach(n => n.classList.remove('is-dragging', 'is-dragging-table'));
  $$('.is-over, .is-swap').forEach(n => n.classList.remove('is-over', 'is-swap'));
  $('.people-panel')?.classList.remove('is-target');
});
// 在空白處拖曳平移；Ctrl／⌘ 加滾輪縮放
function bindPan(vp) {
  let pan = null;
  vp.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('.seat-table')) return;
    pan = { x: e.clientX, y: e.clientY, left: vp.scrollLeft, top: vp.scrollTop };
    vp.classList.add('is-panning'); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => { if (!pan) return; vp.scrollLeft = pan.left - (e.clientX - pan.x); vp.scrollTop = pan.top - (e.clientY - pan.y); });
  const end = () => { pan = null; vp.classList.remove('is-panning'); };
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);
  vp.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, z = zoomOf();
    const nz = clampZoom(z * (e.deltaY < 0 ? 1.1 : 0.9));
    const sx = (vp.scrollLeft + mx - mapOffset) / z, sy = (vp.scrollTop + my) / z;
    setZoom(nz);
    vp.scrollLeft = sx * zoomOf() + mapOffset - mx; vp.scrollTop = sy * zoomOf() - my;
  }, { passive: false });
}
// 桌面打開桌次詳情時，詳情面板蓋住的寬度；手機的桌次詳情是 Dialog，不佔座位圖
const coveredWidth = vp => { const p = !isMobile() && $('.table-panel', vp.parentElement); return p ? p.offsetWidth : 0; };
let mapOffset = 0;
// 套用比例：場地圖在沒被桌次詳情蓋住的區域內水平置中；比那塊區域寬時，右側多留詳情的寬度，才捲得到被蓋住的桌次
function applyZoom(z, at) {
  const vp = $('.map-viewport'), g = geometry();
  if (vp) {
    const stage = $('.map-stage', vp), content = $('.map-content', vp), cover = coveredWidth(vp);
    const w = g.W * z, free = vp.clientWidth - cover - w;
    mapOffset = Math.max(0, Math.floor(free / 2));
    stage.style.width = `${mapOffset + w + (free < 0 ? cover : 0)}px`; stage.style.height = `${g.H * z}px`;
    content.style.left = `${mapOffset}px`; content.style.transform = `scale(${z})`;
    content.classList.toggle('is-compact', isCompact(z));
    if (at) { vp.scrollLeft = at.left; vp.scrollTop = at.top; }
  }
  const pct = $('[data-pct]'); if (pct) pct.textContent = `${Math.round(z * 100)}%`;
}
// 手動縮放：記住比例
function setZoom(z, at) {
  z = Math.round(z * 100) / 100;
  view()[zoomKey()] = z; GH.save(true);
  applyZoom(z, at);
}
// 適合視窗：30 桌全部可見。打開桌次詳情時只用沒被蓋住的寬度；剩下的寬度讓比例低於 35% 時，改用整個座位圖區
// 用外框尺寸（扣掉 1 px 邊框）計算，不受捲軸出現或消失影響，避免比例來回跳
function fit(at = { left: 0, top: 0 }) {
  const vp = $('.map-viewport'); if (!vp) return;
  const W = vp.offsetWidth - 2, H = vp.offsetHeight - 2;
  const g = geometry(), byH = (H - 16) / g.H;
  const zFor = w => Math.min((w - 16) / g.W, byH);
  let z = zFor(W - coveredWidth(vp));
  if (z < 0.35) z = zFor(W);
  fitZ = clampZoom(z);
  applyZoom(fitZ, at);
}
// 重畫或座位圖區大小改變時：適合視窗模式重新計算，手動縮放只重新置中；捲動位置由呼叫的地方決定
const refit = () => { if (savedZoom() == null) fit(null); else applyZoom(zoomOf()); };
function scrollToTable(no) {
  const vp = $('.map-viewport'), t = GH.table(no); if (!vp || !t) return;
  const g = geometry(), z = zoomOf(), visible = vp.clientWidth - coveredWidth(vp);
  vp.scrollTo({ left: mapOffset + (PAD + t.col * g.u.w + g.u.item / 2) * z - visible / 2, top: (g.y0 + t.row * g.u.h + g.u.itemH / 2) * z - vp.clientHeight / 2, behavior: 'smooth' });
}
// 工作區填滿視窗剩餘的高度，座位圖的捲軸才不會落到畫面外
function sizeWorkspace() {
  const ws = $('.workspace'); if (!ws) return;
  if (isMobile()) { ws.style.removeProperty('--ws-h'); return; }
  const demo = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--demo-h')) || 0;
  ws.style.setProperty('--ws-h', `${Math.max(480, innerHeight - ws.getBoundingClientRect().top - scrollY - demo - 16)}px`);
}
GH.afterShellChange = () => sizeWorkspace();
let firstPaint = true;
// 座位圖區大小改變（視窗、Sidebar、示範工具列）時重新適合視窗或重新置中
let vpObserver = null;
GH.afterRender = () => {
  sizeWorkspace();
  const vp = $('.map-viewport');
  vpObserver && vpObserver.disconnect();
  if (vp) {
    refit();
    vp.scrollLeft = scrollPos.left ?? 0; vp.scrollTop = scrollPos.top ?? 0;
    bindPan(vp);
    let size = `${vp.offsetWidth}x${vp.offsetHeight}`;
    vpObserver = new ResizeObserver(() => { const s = `${vp.offsetWidth}x${vp.offsetHeight}`; if (s !== size) { size = s; refit(); } });
    vpObserver.observe(vp, { box: 'border-box' });
  }
  const list = $('.people-list'); if (list) list.scrollTop = scrollPos.list;
  if (hit) scrollToTable(hit);
  if (firstPaint) { firstPaint = false; if (selected) { if (isMobile()) openMobileTable(GH.table(selected)); else scrollToTable(selected); } }
};
// 沒有手動開關過人員面板時，跨過 1024 px 要重畫，預設的收合狀態才會跟著變
let wide = innerWidth >= 1024;
addEventListener('resize', () => { sizeWorkspace(); if ((innerWidth >= 1024) !== wide) { wide = !wide; if (view().panel == null) GH.refresh(); } });

GH.page({
  skeleton: 'map',
  render(v) {
    const vp = $('.map-viewport'); if (vp) { scrollPos.left = vp.scrollLeft; scrollPos.top = vp.scrollTop; }
    const pl = $('.people-list'); if (pl) scrollPos.list = pl.scrollTop;
    $('#page-actions').innerHTML = UI.btn('新增人員', { v: 'primary', icon: 'plus', act: 'newPerson' }) + UI.btn('匯出座位表', { icon: 'download', act: 'exportSeating' });
    $('#page-summary').innerHTML = summaryHTML();
    v.innerHTML = '';
    v.append(UI.tabsPill([{ value: 'map', label: '座位圖' }, { value: 'people', label: '人員' }], mobileTab, x => { mobileTab = x; GH.refresh(); }, { cls: 'only-mobile' }));
    // selected 是桌號，或 'staff' 表示開著工作人員桌
    if (selected && selected !== 'staff' && !GH.table(selected)) selected = null;
    const ws = node(`<div class="workspace" data-tab="${mobileTab}"></div>`);
    ws.append(peoplePanel(), node(mapHTML()));
    if (selected && !isMobile()) $('.map-body', ws).append(selected === 'staff' ? staffPanel() : tablePanel(GH.table(selected)));
    if (selected === 'staff' && isMobile() && mobileDialog) { mobileDialog.setDesc(`${GH.staff().length}/${CAP} 人`); mobileDialog.setBody(staffBody()); }
    else if (selected && isMobile() && mobileDialog) { const t = GH.table(selected); mobileDialog.setDesc(`${GH.seats(t).length}/${CAP} 人`); mobileDialog.setBody(tableBody(t)); }
    bindDrag(ws);
    v.append(ws);
  },
});

Object.assign(actions, {
  noop() {},
  autoSeat() { autoSeatDialog(); },
  addPeople() { const t = GH.table(selected); if (t) UI.addPeopleDialog(t); },
  addStaff() { UI.addStaffDialog(); },
  swapTable() { const t = GH.table(selected); if (t) swapDialog(t); },
  clearTable() {
    const t = GH.table(selected); if (!t || !GH.seats(t).length) return;
    UI.alertDialog({ title: `要清空第 ${t.no} 桌嗎？`, body: `${GH.seats(t).length} 位人員會變成未入座，名單不會刪除。`, confirm: '清空桌次', danger: true, onConfirm: () => { const r = GH.clearTable(t); GH.save(); UI.undoToast(`已清空第 ${t.no} 桌。`, r.undo); GH.refresh(); } });
  },
});
GH.act({
  ...actions,
  newPerson() { UI.personDialog({}); },
  importPeople() { UI.importDialog(); },
  exportSeating() { UI.exportSeating(); },
  clearSearch() { q = ''; GH.refresh(); },
  showAll() { peopleTab = 'all'; GH.refresh(); },
  clearFilters() { filters = { dept: '', cat: '' }; GH.refresh(); },
  panelToggle() { view().panel = !panelOpen(); GH.save(true); GH.refresh(); },
  zoomIn() { setZoom(clampZoom(Math.round((zoomOf() + 0.1) * 10) / 10)); },
  zoomOut() { setZoom(clampZoom(Math.round((zoomOf() - 0.1) * 10) / 10)); },
  zoomFit() { view()[zoomKey()] = null; GH.save(true); fit(); },
  // 全部展開時放大到 100% 看名單，全部收合時回到適合視窗（已確認）
  toggleAll() { view().expanded = !expanded(); view().zoomDesktop = view().zoomMobile = view().expanded ? 1 : null; scrollPos = { left: 0, top: 0, list: scrollPos.list }; GH.save(true); GH.refresh(); },
  openTable(el) { const t = GH.table(el.dataset.no); if (!t) return; selected = t.no; if (isMobile()) openMobileTable(t); GH.refresh(); },
  openStaff() { selected = 'staff'; if (isMobile()) openMobileStaff(); GH.refresh(); },
  closeTable() { selected = null; GH.refresh(); },
  personMenu(el) { const p = GH.person(el.dataset.id); if (p) UI.personMenu(el, p); },
  tableSeatMenu(el) { const p = GH.person(el.dataset.id); if (p) UI.personMenu(el, p, { items: ['seat', 'unseat', 'edit'] }); },
  // 工作人員桌的列操作：移出工作人員桌、編輯
  staffSeatMenu(el) { const p = GH.person(el.dataset.id); if (p) UI.personMenu(el, p, { items: ['seat', 'edit'] }); },
  // 搜尋命中：在座位圖標示那一桌並捲到看得到的位置（第 7.2.1 節）
  locate(el) {
    hit = +el.dataset.no; mobileTab = 'map';
    GH.refresh();
    clearTimeout(hitTimer); hitTimer = setTimeout(() => { hit = null; $$('.seat-table.is-hit').forEach(n => n.classList.remove('is-hit')); }, 4000);
  },
});
</script>
